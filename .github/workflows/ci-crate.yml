# The Rust CLI's CI. Lives beside ci.yml rather than inside it because
# ci.yml is byte-identical across the ten *-le repos (letools-site's
# fleet check); this file is invisible to that check.
#
# Paths include the extension's extraction sources on purpose: parity
# must fail when EITHER side drifts from the shared corpus, and an edit
# to src/extraction/heuristics.ts would otherwise land green.
name: CI (crate)

on:
  # Manually runnable as well as push-triggered. Push events are not
  # guaranteed: during a GitHub Actions incident they are throttled and
  # silently dropped, and a dropped event never replays — leaving a
  # commit with no way to be verified. Dispatch is the escape hatch.
  # ci.yml cannot have this: it is byte-identical across the ten *-le
  # repos and the fleet check enforces that.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crate/**'
      - 'src/extraction/**'
      - 'src/mcp/**'
      - 'scripts/check-extraction-parity.ts'
      - 'scripts/check-extraction-differential.ts'
      - '.github/workflows/ci-crate.yml'
      # The policy job greps every *.md, and in the crate-only repos holds
      # the six agent instruction files to one document. A change to one of
      # those has to be able to reach it — the filter used to admit only
      # crate/**, so both gates could fire only when the files they guard
      # had not been touched. The Rust jobs below skip themselves instead.
      - '**/*.md'
      - '.cursorrules'
      - '.windsurfrules'
      - '.clinerules'
      - '.cursor/**'
      - '.github/copilot-instructions.md'
  pull_request:
    paths:
      - 'crate/**'
      - 'src/extraction/**'
      - 'src/mcp/**'
      - 'scripts/check-extraction-parity.ts'
      - 'scripts/check-extraction-differential.ts'
      - '.github/workflows/ci-crate.yml'
      # The policy job greps every *.md, and in the crate-only repos holds
      # the six agent instruction files to one document. A change to one of
      # those has to be able to reach it — the filter used to admit only
      # crate/**, so both gates could fire only when the files they guard
      # had not been touched. The Rust jobs below skip themselves instead.
      - '**/*.md'
      - '.cursorrules'
      - '.windsurfrules'
      - '.clinerules'
      - '.cursor/**'
      - '.github/copilot-instructions.md'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: crate

jobs:
  # Whether anything the Rust jobs depend on actually moved. "Docs" is
  # deliberately narrow — *.md, LICENSE and the agent instruction files —
  # and anything unrecognised, or an unreadable diff, counts as code. The
  # default is always to run more, never less.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before="$(git rev-list --max-parents=0 HEAD | tail -1)"
            fi
            range="$before..HEAD"
          fi

          if ! files="$(git diff --name-only "$range")"; then files=""; fi

          code=false
          if [ -z "$files" ]; then code=true; fi
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md | LICENSE | .cursorrules | .windsurfrules | .clinerules) ;;
              .cursor/* | .github/copilot-instructions.md) ;;
              *) code=true; break ;;
            esac
          done <<EOF
          $files
          EOF

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code, files changed:"
          echo "$files"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked

  msrv:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.88"
      - name: Verify the declared rust-version actually builds
        run: cargo check --locked

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Forbid inline lint suppressions
        working-directory: .
        run: |
          if grep -rn '#\[allow(' crate/src --include='*.rs'; then
            echo 'Inline #[allow] found — fix the lint or relax it in [lints.clippy] in crate/Cargo.toml.'
            exit 1
          fi
      # extract/ is the layer the corpus pins and the layer that must
      # stay pure. A filesystem call in it means the "testable from a
      # fixture file, no flake" claim in AGENTS.md has quietly stopped
      # being true.
      - name: Forbid filesystem access in the pure extraction layer
        working-directory: .
        run: |
          # Comment lines are filtered out: the module doc in
          # extract/mod.rs names `std::fs` to say it must not appear.
          if grep -rn 'std::fs\|File::open' crate/src/extract --include='*.rs' \
             | grep -v ':[0-9]*: *//'; then
            echo 'extract/ must not touch the filesystem — that belongs in walk.rs and scan.rs.'
            exit 1
          fi
      # The two frontends share one MCP tool and nothing else. A doc that
      # says the crate must reproduce the extension's output re-imposes
      # the constraint the surfaces were deliberately freed from — and it
      # spreads, because the next SPEC.md gets written from a sibling.
      - name: Forbid a doc holding the two surfaces equal
        working-directory: .
        run: |
          hits=$(grep -rniE \
            'difference is a regression|reproduces its output exactly|is the reference implementation for' \
            --include='*.md' . 2>/dev/null | grep -vE '/target/|CHANGELOG\.md' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo
            echo 'Only the shared MCP tool is held equal. The surfaces are IDE-first'
            echo 'and terminal-first and are meant to differ — say which one you mean.'
            exit 1
          fi

  # AGENTS.md sets a 90% line coverage floor per module for extract/.
  # Enforced per module, not on the total: a total hides one module
  # sliding while the others carry it. Scoped to extract/ because
  # everything else is I/O verified by the contract and scenario jobs.
  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage
        run: |
          cargo llvm-cov --no-report
          cargo llvm-cov report --json --output-path coverage.json
          cargo llvm-cov report --html
      - name: Publish the browsable report
        # Uploaded even when the floor check fails — a failing run is
        # exactly when someone wants to see which lines are uncovered.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: crate/target/llvm-cov/html/
          if-no-files-found: error
      - name: Enforce the per-module floor on extract/
        run: |
          python3 - <<'PY'
          import json, sys
          # A backstop against a module nobody tested, not a target. It sits
          # well below where the code actually is — the lowest measured module
          # in the family was 92.69% against the old 90.0 floor, i.e. 2.69
          # points from failing a build over a single new branch. A floor that
          # tracks actual coverage stops being a floor and becomes a tax on
          # writing the next module. Do not raise this to chase a number.
          FLOOR = 75.0
          files = json.load(open("coverage.json"))["data"][0]["files"]
          under = []
          for f in files:
              if "/extract/" not in f["filename"]:
                  continue
              name = f["filename"].split("/")[-1]
              if name == "corpus.rs":
                  continue  # the corpus runner is test-only scaffolding
              pct = f["summary"]["lines"]["percent"]
              print(f"{name:16} {pct:6.2f}%")
              if pct < FLOOR:
                  under.append((name, pct))
          if under:
              print(f"\nAGENTS.md sets a {FLOOR}% line coverage floor per module in extract/:")
              for name, pct in under:
                  print(f"  {name}: {pct:.2f}%")
              sys.exit(1)
          PY

  # What only a document too big for the fast path can prove: that the
  # scan stays linear on a document with no line breaks to amortise
  # over, and that columns hold across megabytes of non-ASCII.
  scenarios:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Scenarios against an oversized document
        env:
          DATES_LE_SCENARIOS: "1"
        run: cargo test --test scenarios -- --test-threads=1

  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-audit
      - run: cargo audit

  # Fails when the extension's extraction behaviour and the shared
  # corpus (crate/fixtures/) disagree — the reason both frontends live
  # in one repo at all.
  parity:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Extraction and MCP parity
        working-directory: .
        env:
          # Four of the six shapes carry no timezone, so the corpus is
          # only meaningful in the zone it was taken in. A zone with
          # daylight saving is the only kind that can catch a wrong
          # conversion, so that is the one pinned.
          TZ: America/New_York
        run: bun scripts/check-extraction-parity.ts

  # Inputs that break tools, run against the built binary over a tree
  # the test constructs. Not a fixture directory: Windows cannot check in
  # a FIFO, a symlink loop or a file nobody may read, so the tree is
  # built at runtime and every case a platform cannot express is named
  # rather than passed quietly.
  #
  # Three platforms on every push, so it stays under two minutes: one
  # scan each of a megabyte-long line and a hundred thousand lines, and
  # nothing bigger.
  hazards:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Hazardous inputs, against the binary
        run: cargo test --locked --test hazards -- --nocapture

  # Behaviour that differs by operating system, asserted rather than
  # hoped. The report's path separator shipped wrong in this family for a
  # release because the only runner that produced `\` was the one nobody
  # read the JSON from.
  platform:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - run: cargo test --locked --test platform -- --nocapture
      # This crate resolves zone-less dates against the machine, its
      # tests name their own zone with `time::with_zone`, and Windows
      # ignores `TZ` entirely. So the suite must not depend on the
      # variable at all — proved by running it three times and diffing
      # the outcomes rather than by asserting it in prose.
      #
      # Asia/Kolkata is a half-hour offset on purpose: an arithmetic
      # mistake that survives UTC often does not survive +05:30.
      - name: Build the test binaries once
        run: cargo test --locked --no-run
      - name: The suite is independent of TZ
        shell: bash
        run: |
          set -euo pipefail
          run_suite() {
            cargo test --locked --no-fail-fast 2>&1 \
              | grep -E '^test .* \.\.\. (ok|FAILED|ignored)$' \
              | LC_ALL=C sort
          }
          TZ=UTC run_suite > /tmp/tz-utc.txt
          TZ=Asia/Kolkata run_suite > /tmp/tz-kolkata.txt
          (unset TZ; run_suite > /tmp/tz-unset.txt)
          test -s /tmp/tz-utc.txt || { echo 'no test results were captured'; exit 1; }
          diff -u /tmp/tz-utc.txt /tmp/tz-kolkata.txt
          diff -u /tmp/tz-utc.txt /tmp/tz-unset.txt

  # The corpus pins cases somebody wrote down. This generates them: a
  # format, a value and a wrapper, combined from a printed seed, fed to
  # BOTH servers' `extract_dates` — the one tool they share — and
  # required to come back byte-identical.
  #
  # Scoped to that tool on purpose. The two surfaces are allowed to
  # differ and do: the extension is IDE-first and the CLI is
  # terminal-first, so the walk, --strict, --sort, --tz and the exit
  # codes are capabilities rather than drift. What may never differ is
  # the answer an agent gets from the same call.
  differential:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - run: cargo build --release --locked
      - name: Generated differential, both servers
        working-directory: .
        env:
          TZ: America/New_York
          # Fixed so a failure replays exactly. The script prints it on
          # every run, and prints the failing document with it.
          DIFFERENTIAL_SEED: "20240115"
        run: bun scripts/check-extraction-differential.ts

  # A standing net over the pure layer, not a proof. `parse.rs` is a
  # hand-written reimplementation of both of V8's date parsers driven by
  # a 178-case oracle — exactly the shape where an input nobody wrote
  # down panics or spins. Seeded from that oracle, because a mutation of
  # something that nearly parses reaches far more of the parser than a
  # random string does.
  #
  # Sixty seconds a target, ubuntu only: it is a budget of seconds
  # rather than a set of cases, and three copies of it would buy nothing.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Fuzz the parsers and the scan
        env:
          DATES_LE_FUZZ: "1"
          DATES_LE_FUZZ_SECONDS: "60"
          # Printed on every run and on every failure, so a red build
          # replays with one environment variable.
          DATES_LE_FUZZ_SEED: "539230485"
        run: cargo test --locked --lib fuzz -- --test-threads=1 --nocapture

  # A wall-clock ceiling and a linearity check on a generated tree.
  # Release, because a debug binary is several times slower and the
  # number recorded in the test would mean nothing against it. Ubuntu
  # only: a timing assertion on three operating systems is three chances
  # to flake for one piece of information.
  budget:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Scan a 500-file tree inside its budget
        env:
          DATES_LE_BUDGET: "1"
        run: cargo test --release --locked --test budget -- --test-threads=1 --nocapture

  # Does the crate open what it claims to open? One file per name in the
  # alias table plus a dozen it has never heard of, and a report line
  # required for every one — plus the other half of the same question: a
  # format the schema advertises with no corpus document is a format the
  # two frontends have never been compared on.
  coverage-matrix:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - run: cargo test --locked --test coverage_matrix -- --nocapture
